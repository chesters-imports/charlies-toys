<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Prolog · concept sheet</title>
  <style>
    body { font-family: Georgia, serif; max-width: 40rem; margin: 2rem auto; padding: 0 1rem; background: #111; color: #cfc; }
    h1 { font-size: 1.2rem; letter-spacing: 0.08em; }
    label { display: block; margin-top: 1rem; font-size: 0.85rem; color: #8a8; }
    input, textarea { width: 100%; background: #1a1a1a; color: #efe; border: 1px solid #363; padding: 0.5rem; font-family: Consolas, monospace; font-size: 0.9rem; }
    textarea { min-height: 4.5rem; }
    button { margin-top: 1.25rem; padding: 0.6rem 1rem; background: #242; color: #cfc; border: 1px solid #4a4; cursor: pointer; }
    pre { margin-top: 1.5rem; background: #0a0a0a; border: 1px solid #333; padding: 1rem; white-space: pre-wrap; font-size: 0.8rem; }
    .hint { color: #686; font-size: 0.85rem; }
  </style>
</head>
<body>
  <h1>SOMETHING MATTERED HERE · concept sheet</h1>
  <p class="hint">Fill → Generate YAML → save as sheets/concepts/&lt;id&gt;.yaml</p>

  <label>id (one word, lowercase)</label>
  <input id="id" placeholder="who" />

  <label>look</label>
  <textarea id="look" placeholder="YOU TRY TO LOOK AT…"></textarea>
  <label>echo_look</label>
  <input id="echo_look" />

  <label>remember</label>
  <textarea id="remember"></textarea>
  <label>echo_remember</label>
  <input id="echo_remember" />

  <label>think</label>
  <textarea id="think"></textarea>
  <label>echo_think</label>
  <input id="echo_think" />

  <button type="button" id="go">Generate YAML</button>
  <pre id="out">(yaml appears here)</pre>

  <script>
    function block(s) {
      if (!s || !s.trim()) return '""';
      const lines = s.replace(/\r\n/g, '\n').trimEnd().split('\n');
      return '|\n' + lines.map(l => '  ' + l).join('\n');
    }
    document.getElementById('go').onclick = () => {
      const id = (document.getElementById('id').value || 'unnamed').trim().toLowerCase();
      const y = [
        'id: ' + id,
        'look: ' + block(document.getElementById('look').value),
        'echo_look: ' + block(document.getElementById('echo_look').value),
        'remember: ' + block(document.getElementById('remember').value),
        'echo_remember: ' + block(document.getElementById('echo_remember').value),
        'think: ' + block(document.getElementById('think').value),
        'echo_think: ' + block(document.getElementById('echo_think').value),
        ''
      ].join('\n');
      document.getElementById('out').textContent = y;
    };
  </script>
</body>
</html>
